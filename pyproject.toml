[tool.mypy]
python_version = "3.10"

files = ["src", "main.py"]

namespace_packages = true
explicit_package_bases = true
mypy_path = "src"

ignore_missing_imports = true

strict = true
disallow_untyped_defs = true
warn_return_any = true
warn_unused_configs = true

plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-v"

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/config/constants/style_constants.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

